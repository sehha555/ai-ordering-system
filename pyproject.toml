[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-ordering-system"
version = "0.1.0"
description = "源飯糰 AI 語音點餐系統"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Your Name", email = "your@email.com"}
]

dependencies = [
    "python-dotenv>=1.0.0",
    "loguru>=0.7.0",
    "pydantic>=2.5.0",
    "jsonschema>=4.20.0",
    "fastapi>=0.104.1",
    "uvicorn>=0.24.0",
    "openai>=1.3.0",
    "pydantic-settings>=2.1.0",
    "requests>=2.32.5",
    "openai-whisper>=20231117",
    "edge-tts>=6.1.0",
    "python-multipart>=0.0.6",
    "numpy>=1.21.0",
    "soundfile>=0.12.1",
    "librosa>=0.10.0",
    "opencc-python-reimplemented>=0.1.7",
]

[project.optional-dependencies]
asr = [
    "qwen-asr>=0.0.6",
    "torch>=2.0.0",
]
models = [
    "funasr>=1.1.0",
    "omegaconf>=2.3.0",
    "kaldiio>=2.18.0",
    "hydra-core>=1.3.0",
    "transformers>=4.40.0",
    "scipy>=1.10.0",
    "torch>=2.0.0",
    "torchaudio>=2.0.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.12.0",
    "ruff>=0.1.13",
    "mypy>=1.7.0",
    "pytest-bdd>=8.1.0",
]

[project.scripts]
yuan-ordering = "src.main:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# For pytest-bdd
bdd_features_base_dir = "tests/features"
# Custom markers for test categorization
markers = [
    "bdd: BDD tests using pytest-bdd.",
    "security: Security-related tests.",
    "contract: Interface contract tests.",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
select = ["E", "F", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.uv]
# 覆蓋 funasr 上游的 numpy<=1.26.4 限制
override-dependencies = [
    "numpy>=1.26.4,<2.0",
]

# PyTorch CUDA 12.8 index
[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

# 指定 torch/torchaudio 從 CUDA index 安裝
[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchaudio = { index = "pytorch-cu128" }

[tool.hatch.build.targets.wheel]
packages = ["src"]

