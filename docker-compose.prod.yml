# docker-compose.prod.yml — 生產模式 override
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d

services:
  backend:
    restart: unless-stopped
    env_file: .env.prod
    volumes:
      - orders_data:/app/orders.db
    environment:
      - ENVIRONMENT=prod
      - LOG_FORMAT=json
      - REDIS_URL=redis://redis:6379
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  frontend:
    restart: unless-stopped
    environment:
      - API_REWRITE_TARGET=http://backend:8000

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  redis_data:
  orders_data:
