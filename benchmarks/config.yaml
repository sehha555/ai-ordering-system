# 模型 Benchmark 配置
# 新增模型只需在對應類別加一個條目

asr:
  models:
    - id: qwen3-asr-turbo
      name: "Qwen3-ASR Turbo"
      adapter: qwen3
      params:
        model_size: turbo
        language: zh
    - id: sensevoice
      name: "SenseVoice"
      adapter: sensevoice
      params:
        model_size: small
        language: zh
  metrics: [cer, latency, success_rate]

tts:
  models:
    - id: edge-tts-tw
      name: "Edge TTS (台灣女聲)"
      adapter: edge_tts
      params:
        voice: "zh-TW-HsiaoChenNeural"
    - id: cosyvoice2
      name: "CosyVoice 2"
      adapter: cosyvoice2
      params:
        model_path: null  # 需設定
    - id: elevenlabs-v3
      name: "ElevenLabs v3"
      adapter: elevenlabs
      params:
        api_key_env: ELEVENLABS_API_KEY
        model_id: eleven_multilingual_v2
        voice_id: null  # 需設定
  metrics: [first_byte_latency, rtf, audio_quality]

llm:
  models:
    - id: qwen3.5-9b
      name: "Qwen3.5-9B (no_think)"
      adapter: openai_compatible
      params:
        base_url: "http://127.0.0.1:1234/v1"
        model: "unsloth/qwen3.5-9b"
        temperature: 0.2
        top_p: 0.8
        top_k: 20
        min_p: 0.01
        repeat_penalty: 1.0   # 避免 llama.cpp 預設 1.1 懲罰 priming 重複 token
    - id: qwen3.5-9b-text-tag
      name: "Qwen3.5-9B (text_tag)"
      adapter: text_tag
      allow_clarification: true
      params:
        base_url: "http://127.0.0.1:1234/v1"
        model: "unsloth/qwen3.5-9b"
        temperature: 0.2
        top_p: 0.8
        top_k: 20
        min_p: 0.0              # Qwen3 官方推薦 non-thinking mode
        repeat_penalty: 1.0
        force_no_think: true   # 跳過 thinking block，直接輸出 tags
    - id: gemini-2.5-flash
      name: "Gemini 2.5 Flash (text_tag)"
      adapter: gemini_text_tag
      allow_clarification: true   # metric 設定：沒 tag 但回覆含品項關鍵字算 pass（先問再加行為）
      params:
        api_key_env: GEMINI_API_KEY
        model: "gemini-2.5-flash"
        temperature: 0.2
    - id: gemini-2.0-flash
      name: "Gemini 2.0 Flash (text_tag)"
      adapter: gemini_text_tag
      allow_clarification: true
      params:
        api_key_env: GEMINI_API_KEY
        model: "gemini-2.0-flash"
        temperature: 0.2
    # gemma4-e4b: 65% 通過率，中文品項理解差，不採用（2026-04-03 測試）
    # reasoning distilled 已驗證：延遲增加 + tool calling 準確度下降，移除
    # - id: qwen3.5-9b-reasoning-distilled（停用）
  metrics: [tool_call_accuracy, response_latency, scenario_pass_rate]

e2e:
  models:
    - id: qwen25-omni-7b
      name: "Qwen2.5-Omni-7B"
      adapter: qwen_omni
      params:
        model_path: null  # 需設定
  metrics: [e2e_latency, accuracy, audio_quality]

benchmark:
  repeat: 3        # 每個測試案例跑幾次取平均
  timeout: 120     # 單次測試超時秒數（tool call loop 最多 4 步，每步 ~15s）
  concurrency: 2   # 平行 workers 數（--workers 未指定時讀此值）
  output_dir: reports
