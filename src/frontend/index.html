<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>源飯糰 語音點餐</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <div class="app-container">
        <!-- 左側：菜單區域 (60%) -->
        <div class="menu-section">
            <header class="header">
                <h1 id="storeName">載入中...</h1>
                <div class="status-indicator" id="statusIndicator">
                    <span class="status-dot"></span>
                    <span class="status-text">連線中...</span>
                </div>
            </header>

            <div class="menu-container" id="menuContainer">
                <img src="/static/menu.png" alt="菜單" class="menu-image">
            </div>
        </div>

        <!-- 右側：點餐互動區 (40%) -->
        <div class="interaction-section">
            <!-- 初始狀態：大圓形音量波形 -->
            <div class="voice-area" id="voiceArea">
                <div class="voice-circle" id="voiceCircle">
                    <canvas id="waveformCanvas"></canvas>
                    <div class="voice-prompt" id="voicePrompt">
                        <span class="mic-icon">🎤</span>
                        <span>請說話開始點餐</span>
                    </div>
                </div>
                <div class="voice-status" id="voiceStatus">語音喚醒已啟用</div>
            </div>

            <!-- 點餐中狀態：訂單列表 + 縮小波形 -->
            <div class="order-area hidden" id="orderArea">
                <div class="order-header">
                    <h2>已點品項</h2>
                    <button class="btn-clear" id="clearOrderBtn" title="清空訂單">清空</button>
                </div>

                <div class="order-items" id="orderItems">
                    <div class="order-empty">尚未點餐</div>
                </div>

                <div class="order-total">
                    <span>總計</span>
                    <span id="orderTotal">$0</span>
                </div>

                <!-- 縮小的圓形波形 -->
                <div class="voice-circle-small" id="voiceCircleSmall">
                    <canvas id="waveformCanvasSmall"></canvas>
                    <div class="voice-prompt-small" id="voicePromptSmall">
                        <span class="mic-icon">🎤</span>
                    </div>
                </div>
                <div class="voice-status-small" id="voiceStatusSmall">繼續說話點餐</div>

                <button class="btn-checkout" id="checkoutBtn">結帳</button>
            </div>

            <!-- 結帳流程頁面 -->
            <div class="checkout-flow hidden" id="checkoutFlow">
                <!-- 步驟 1：用餐方式 -->
                <div class="checkout-step" id="stepDineType">
                    <h2>用餐方式</h2>
                    <div class="checkout-options">
                        <button class="checkout-option" data-value="dine-in">
                            <span class="option-icon">🍽️</span>
                            <span class="option-text">內用</span>
                        </button>
                        <button class="checkout-option" data-value="take-out">
                            <span class="option-icon">🥡</span>
                            <span class="option-text">外帶</span>
                        </button>
                    </div>
                </div>

                <!-- 步驟 2：付款方式 -->
                <div class="checkout-step hidden" id="stepPayment">
                    <h2>付款方式</h2>
                    <div class="checkout-options">
                        <button class="checkout-option" data-value="cash">
                            <span class="option-icon">💵</span>
                            <span class="option-text">現金</span>
                        </button>
                        <button class="checkout-option" data-value="mobile">
                            <span class="option-icon">📱</span>
                            <span class="option-text">行動支付</span>
                        </button>
                    </div>
                </div>

                <!-- 步驟 3：訂單確認 -->
                <div class="checkout-step hidden" id="stepConfirm">
                    <h2>確認訂單</h2>
                    <div class="confirm-summary" id="confirmSummary">
                        <!-- 動態填入訂單明細 -->
                    </div>
                    <div class="confirm-info">
                        <div class="confirm-row">
                            <span>用餐方式</span>
                            <span id="confirmDineType">-</span>
                        </div>
                        <div class="confirm-row">
                            <span>付款方式</span>
                            <span id="confirmPayment">-</span>
                        </div>
                        <div class="confirm-row total">
                            <span>總計</span>
                            <span id="confirmTotal">$0</span>
                        </div>
                    </div>
                    <button class="btn-confirm" id="confirmOrderBtn">確認送出</button>
                </div>

                <!-- 步驟 4：完成 -->
                <div class="checkout-step hidden" id="stepComplete">
                    <div class="complete-icon">✅</div>
                    <h2>訂單完成</h2>
                    <div class="order-number">
                        <span>取餐號碼</span>
                        <span class="number" id="orderNumber">--</span>
                    </div>
                    <p class="complete-message">請保留此畫面，稍後取餐</p>
                    <button class="btn-new-order" id="newOrderBtn">開始新訂單</button>
                </div>

                <button class="btn-back hidden" id="checkoutBackBtn">返回</button>
            </div>
        </div>
    </div>

    <script src="/static/app.js"></script>
</body>
</html>
