<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <!-- 圓形底色 -->
  <ellipse cx="100" cy="100" rx="95" ry="98" fill="#729DAD"/>

  <!-- 篆體「源」字 — 簡化筆畫，白色鏤空 -->
  <g fill="#ffffff">
    <!-- 三點水（氵）左側 -->
    <!-- 上點 -->
    <rect x="28" y="52" width="12" height="22" rx="3"/>
    <!-- 中橫 -->
    <rect x="24" y="88" width="18" height="12" rx="3"/>
    <!-- 下撇 -->
    <rect x="28" y="114" width="12" height="28" rx="3"/>

    <!-- 右邊「原」的外框 — 像個容器 -->
    <!-- 頂蓋橫 -->
    <rect x="58" y="42" width="90" height="12" rx="4"/>
    <!-- 左豎 -->
    <rect x="58" y="42" width="12" height="116" rx="4"/>
    <!-- 右豎 -->
    <rect x="136" y="42" width="12" height="116" rx="4"/>

    <!-- 內部「白」的部分 — 簡化為方框 -->
    <rect x="78" y="64" width="50" height="12" rx="3"/>
    <rect x="78" y="64" width="12" height="40" rx="3"/>
    <rect x="116" y="64" width="12" height="40" rx="3"/>
    <rect x="78" y="92" width="50" height="12" rx="3"/>

    <!-- 內部橫畫（「小」的簡化）-->
    <ellipse cx="103" cy="118" rx="18" ry="6"/>

    <!-- 底部兩腳 -->
    <rect x="70" y="146" width="12" height="20" rx="4"/>
    <rect x="124" y="146" width="12" height="20" rx="4"/>
    <!-- 中腳 -->
    <rect x="97" y="140" width="12" height="26" rx="4"/>
  </g>
</svg>
