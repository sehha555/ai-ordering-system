<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI Ordering System · Workflow Map</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
  :root {
    --bg: #fafaf9;
    --surface: #ffffff;
    --surface-alt: #f7f7f5;
    --border: #ebebeb;
    --border-strong: #d4d4d4;

    --text: #37352F;
    --text-secondary: #787774;
    --text-muted: #9B9A97;
    --text-dim: #c4c4c1;

    --src: #DDEBF1;    --src-strong: #0B6E99;
    --skill: #DDEDEA;  --skill-strong: #0F7B6C;
    --store: #FAEBDD;  --store-strong: #D9730D;
    --ext: #EAE4F2;    --ext-strong: #6940A5;

    --highlight: #d9a200;
    --highlight-soft: #fff4cc;
    --line: #c4c4c1;
    --line-ghost: rgba(155, 154, 151, 0.28);
    --line-active: #d9a200;

    --badge-bg: #ffffff;
    --node-shadow: rgba(217, 162, 0, 0.22);
  }
  :root[data-theme="dark"] {
    --bg: #18181a;
    --surface: #232325;
    --surface-alt: #1d1d1f;
    --border: #34343a;
    --border-strong: #4a4a52;

    --text: #e8e8e3;
    --text-secondary: #a8a8a2;
    --text-muted: #757571;
    --text-dim: #555550;

    --src: #173544;    --src-strong: #6cb6d4;
    --skill: #143630;  --skill-strong: #5fc4af;
    --store: #3a2814;  --store-strong: #f4a85a;
    --ext: #2b2240;    --ext-strong: #b8a0e0;

    --highlight: #f4c84a;
    --highlight-soft: #3a2e10;
    --line: #4a4a52;
    --line-ghost: rgba(117, 117, 113, 0.30);
    --line-active: #f4c84a;

    --badge-bg: #232325;
    --node-shadow: rgba(244, 200, 74, 0.28);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, "PingFang TC", "Microsoft JhengHei", sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.55;
    font-size: 13px;
  }
  .app { display: grid; grid-template-columns: 320px 1fr; min-height: 100vh; }

  /* Sidebar */
  aside {
    background: var(--surface);
    border-right: 1px solid var(--border);
    padding: 20px 16px;
    overflow-y: auto;
    max-height: 100vh;
    position: sticky;
    top: 0;
  }
  aside h1 { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
  aside .subtitle { font-size: 12px; color: var(--text-secondary); margin-bottom: 16px; }
  aside .header-row { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .theme-toggle {
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text-secondary);
    font-family: inherit;
    font-size: 11px;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 4px;
    cursor: pointer;
    transition: all 0.15s ease;
    flex-shrink: 0;
  }
  .theme-toggle:hover {
    background: var(--surface-alt);
    border-color: var(--border-strong);
    color: var(--text);
  }
  aside .legend { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 18px; }
  aside .legend > div { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: 500; }
  aside .legend .src { background: var(--src); color: var(--src-strong); }
  aside .legend .skill { background: var(--skill); color: var(--skill-strong); }
  aside .legend .store { background: var(--store); color: var(--store-strong); }
  aside .legend .ext { background: var(--ext); color: var(--ext-strong); }
  aside h2 { font-size: 11px; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px; font-weight: 600; }

  /* Overview button at top */
  .overview-btn {
    width: 100%;
    padding: 12px;
    border: 1.5px solid var(--highlight);
    background: var(--highlight-soft);
    color: var(--text);
    border-radius: 6px;
    cursor: pointer;
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 600;
    margin-bottom: 14px;
    transition: all 0.18s ease;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .overview-btn:hover { background: var(--highlight); color: white; }
  .overview-btn.active { background: var(--highlight); color: white; }
  .overview-btn .meta { font-size: 10.5px; opacity: 0.8; font-weight: 500; }

  .category-filter {
    width: 100%;
    background: var(--surface);
    border: 1px solid var(--border);
    color: var(--text);
    font-family: inherit;
    font-size: 12.5px;
    font-weight: 500;
    padding: 8px 32px 8px 12px;
    border-radius: 6px;
    margin-bottom: 12px;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='10' viewBox='0 0 10 10'><path d='M2 4 L5 7 L8 4' fill='none' stroke='%23787774' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/></svg>");
    background-repeat: no-repeat;
    background-position: right 12px center;
    background-size: 10px;
    transition: all 0.15s ease;
  }
  .category-filter:hover { border-color: var(--border-strong); }
  .category-filter:focus { outline: none; border-color: var(--highlight); box-shadow: 0 0 0 2px var(--highlight-soft); }

  .flow-item {
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 6px;
    margin-bottom: 6px;
    cursor: pointer;
    transition: all 0.18s ease;
    background: var(--surface);
  }
  .flow-item:hover { border-color: var(--border-strong); background: var(--surface-alt); transform: translateX(2px); }
  .flow-item.active {
    border-color: var(--highlight);
    background: var(--highlight-soft);
    box-shadow: 0 0 0 1px var(--highlight);
  }
  .flow-item .name { font-weight: 600; font-size: 12.5px; margin-bottom: 3px; }
  .flow-item .trigger { font-size: 11px; color: var(--text-secondary); line-height: 1.4; }

  main { padding: 24px 28px; overflow-x: auto; }
  .flow-header { margin-bottom: 16px; animation: fadeSlide 0.35s ease backwards; }
  .flow-header h2 { font-size: 20px; font-weight: 600; margin-bottom: 6px; }
  .flow-header .desc { color: var(--text-secondary); font-size: 13px; max-width: 920px; }
  .flow-header .trigger-pill {
    display: inline-block;
    background: var(--surface-alt);
    color: var(--text-secondary);
    border: 1px solid var(--border);
    padding: 3px 9px;
    border-radius: 4px;
    font-size: 11.5px;
    font-family: ui-monospace, monospace;
    margin-top: 8px;
  }
  .flow-header .stats {
    display: flex; gap: 14px; font-size: 11.5px; color: var(--text-muted);
    margin-top: 8px;
  }
  .flow-header .stats b { color: var(--text); font-weight: 600; }

  /* === Graph === */
  .graph-wrap {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 24px 28px 32px;
    margin-bottom: 20px;
    position: relative;
    min-width: 1280px;
  }
  .graph {
    display: grid;
    grid-template-columns: 1fr 1fr 1.15fr 1fr;
    gap: 56px;
    position: relative;
    z-index: 2;
  }
  .col-header {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
    text-align: center; margin-bottom: 12px;
    padding: 6px 8px; border-radius: 4px;
  }
  .col-header.src { background: var(--src); color: var(--src-strong); }
  .col-header.skill { background: var(--skill); color: var(--skill-strong); }
  .col-header.store { background: var(--store); color: var(--store-strong); }
  .col-header.ext { background: var(--ext); color: var(--ext-strong); }
  .col { display: flex; flex-direction: column; gap: 8px; }

  /* Subgroup divider inside a column */
  .subgroup-header {
    font-size: 10px;
    font-weight: 600;
    color: var(--text-muted);
    text-transform: uppercase;
    letter-spacing: 0.6px;
    padding: 8px 4px 4px;
    border-top: 1px dashed var(--border);
    margin-top: 6px;
  }
  .subgroup-header:first-of-type, .col > .subgroup-header:first-child { border-top: none; margin-top: 0; padding-top: 4px; }

  .node {
    padding: 9px 11px;
    border: 1.5px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    font-size: 11.5px;
    font-weight: 500;
    line-height: 1.3;
    text-align: center;
    transition:
      opacity 0.35s ease,
      transform 0.35s cubic-bezier(0.34, 1.56, 0.64, 1),
      border-color 0.3s ease,
      background 0.3s ease,
      color 0.3s ease,
      box-shadow 0.3s ease;
    position: relative;
  }
  .node.dim { opacity: 0.22; transform: scale(0.98); }
  .node.overview { /* overview 模式：所有 node 都顯色但比 active 稍弱 */
    opacity: 1;
  }
  .node.overview.src { border-color: var(--src-strong); background: var(--src); color: var(--src-strong); }
  .node.overview.skill { border-color: var(--skill-strong); background: var(--skill); color: var(--skill-strong); }
  .node.overview.store { border-color: var(--store-strong); background: var(--store); color: var(--store-strong); }
  .node.overview.ext { border-color: var(--ext-strong); background: var(--ext); color: var(--ext-strong); }
  .node.active {
    border-width: 2px;
    transform: scale(1.06);
    box-shadow: 0 4px 14px var(--node-shadow);
    animation: nodePop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) backwards;
  }
  @keyframes nodePop {
    0%   { opacity: 0.2; transform: scale(0.85); }
    60%  { transform: scale(1.1); }
    100% { opacity: 1; transform: scale(1.06); }
  }
  .node.src.active { border-color: var(--src-strong); background: var(--src); color: var(--src-strong); }
  .node.skill.active { border-color: var(--skill-strong); background: var(--skill); color: var(--skill-strong); }
  .node.store.active { border-color: var(--store-strong); background: var(--store); color: var(--store-strong); }
  .node.ext.active { border-color: var(--ext-strong); background: var(--ext); color: var(--ext-strong); }

  .node .step-no {
    position: absolute;
    top: -10px; left: -10px;
    width: 22px; height: 22px;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: var(--highlight);
    color: white;
    font-size: 10.5px; font-weight: 700;
    display: none;
    align-items: center; justify-content: center;
    box-shadow: 0 2px 5px rgba(0,0,0,0.15);
    border: 2px solid var(--surface);
  }
  .node.active .step-no { display: flex; }

  /* === SVG edges === */
  svg.edges {
    position: absolute;
    top: 0; left: 0;
    width: 100%; height: 100%;
    pointer-events: none;
    z-index: 1;
  }
  svg.edges .edge-line {
    fill: none;
    stroke: var(--line-active);
    stroke-width: 2.5;
    stroke-linecap: round;
  }
  svg.edges .edge-ghost {
    fill: none;
    stroke: var(--line-ghost);
    stroke-width: 1.2;
    stroke-linecap: round;
  }
  svg.edges .step-badge { fill: var(--badge-bg); stroke: var(--highlight); stroke-width: 2; }
  svg.edges .step-badge-text {
    fill: var(--highlight);
    font-family: 'Inter', sans-serif;
    font-size: 11px;
    font-weight: 700;
    text-anchor: middle;
    dominant-baseline: central;
  }

  /* === Step list === */
  .steps {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 18px 22px;
  }
  .steps h3 { font-size: 12px; font-weight: 600; color: var(--text-secondary); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 14px; }
  .step-row {
    display: grid;
    grid-template-columns: 28px 1fr;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeSlide 0.45s ease backwards;
  }
  .step-row:last-child { border-bottom: none; }
  .step-num {
    width: 24px; height: 24px;
    aspect-ratio: 1/1;
    border-radius: 50%;
    background: var(--highlight);
    color: white;
    font-size: 11px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .step-body .route { font-family: ui-monospace, monospace; font-size: 12px; color: var(--text); margin-bottom: 3px; }
  .step-body .route .arrow { color: var(--text-muted); margin: 0 6px; }
  .step-body .payload {
    font-size: 11.5px; color: var(--text-secondary);
    border-left: 2px solid var(--highlight); padding-left: 8px;
  }

  /* === Overview info pane === */
  .overview-info {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 20px 24px;
  }
  .overview-info h3 { font-size: 14px; font-weight: 600; margin-bottom: 12px; }
  .overview-info .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
  @media (max-width: 1300px) { .overview-info .grid { grid-template-columns: repeat(2, 1fr); } }
  .overview-info .pillar { padding: 14px; border-radius: 6px; }
  .overview-info .pillar.src { background: var(--src); }
  .overview-info .pillar.skill { background: var(--skill); }
  .overview-info .pillar.store { background: var(--store); }
  .overview-info .pillar.ext { background: var(--ext); }
  .overview-info .pillar h4 { font-size: 12.5px; font-weight: 700; margin-bottom: 6px; }
  .overview-info .pillar.src h4 { color: var(--src-strong); }
  .overview-info .pillar.skill h4 { color: var(--skill-strong); }
  .overview-info .pillar.store h4 { color: var(--store-strong); }
  .overview-info .pillar.ext h4 { color: var(--ext-strong); }
  .overview-info .pillar p { font-size: 11.5px; line-height: 1.45; color: var(--text); opacity: 0.85; }
  .overview-info .hint {
    margin-top: 16px; padding: 10px 14px;
    background: var(--surface-alt); border-radius: 6px;
    font-size: 12px; color: var(--text-secondary);
    border-left: 3px solid var(--highlight);
  }

  /* === 專案進度區塊（Overview 模式） === */
  .progress { margin-top: 20px; border-top: 1px solid var(--border); padding-top: 16px; }
  .progress > h4 { font-size: 13px; font-weight: 700; margin-bottom: 12px; }
  .milestones { margin-bottom: 4px; }
  .milestone {
    display: grid;
    grid-template-columns: 16px 56px 1fr;
    gap: 8px;
    padding: 5px 0;
    font-size: 12px;
    align-items: start;
  }
  .milestone .dot {
    width: 9px; height: 9px; border-radius: 50%;
    background: var(--skill-strong);
    margin-top: 4px;
    justify-self: center;
  }
  .milestone.latest .dot { background: var(--highlight); box-shadow: 0 0 0 3px var(--highlight-soft); }
  .milestone .date { color: var(--text-muted); font-family: ui-monospace, monospace; font-size: 11px; padding-top: 1px; white-space: nowrap; }
  .milestone .what b { font-weight: 600; }
  .milestone .what .sub { color: var(--text-secondary); font-size: 11.5px; }
  .progress .row-title {
    font-size: 11px; font-weight: 600; color: var(--text-secondary);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin: 14px 0 7px;
  }
  .todo-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .todo-pills span {
    background: var(--store); color: var(--store-strong);
    font-size: 11.5px; font-weight: 500;
    padding: 3px 10px; border-radius: 99px;
  }
  .todo-pills span.backlog {
    background: var(--surface-alt); color: var(--text-secondary);
    border: 1px solid var(--border);
  }
  .progress .metrics {
    display: flex; gap: 18px; flex-wrap: wrap;
    margin-top: 14px; font-size: 11.5px; color: var(--text-muted);
  }
  .progress .metrics b { color: var(--text); font-weight: 600; }

  @keyframes fadeSlide {
    from { opacity: 0; transform: translateY(6px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes drawLine { to { stroke-dashoffset: 0; } }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
    }
  }
</style>
</head>
<body>
<div class="app">
  <aside>
    <div class="header-row">
      <h1>AI Ordering System</h1>
      <button class="theme-toggle" id="theme-toggle" title="切換亮暗主題">Dark</button>
    </div>
    <div class="subtitle">Workflow Map · 軟工架構全景 · 更新 2026-06-11</div>
    <div class="legend">
      <div class="src">觸發 / 客戶端</div>
      <div class="skill">前端 Next.js</div>
      <div class="store">後端 FastAPI</div>
      <div class="ext">模型 / 資料</div>
    </div>

    <button class="overview-btn active" id="overview-btn">
      <span>全景模式 Overview</span>
      <span class="meta">所有節點 + 全部資料流</span>
    </button>

    <h2>Flows · 點擊聚焦</h2>
    <select id="category-filter" class="category-filter"></select>
    <div id="flow-list"></div>
  </aside>

  <main>
    <div class="flow-header" id="flow-header"></div>
    <div class="graph-wrap">
      <div class="graph" id="graph"></div>
      <svg class="edges" id="edges"></svg>
    </div>
    <div id="info-pane"></div>
  </main>
</div>

<script>

const STAGGER_MS = 200;

  src:   ['people', 'device', 'identity'],
  skill: ['ui_main', 'hooks', 'state', 'admin_ui'],
  store: ['boot', 'routers', 'dm', 'ai_svc', 'support'],
  ext:   ['ai_model', 'storage', 'config']
};

function isOverview() { return currentFlow === null; }

function renderGraph() {
  const graph = document.getElementById('graph');
  const cols = { src: [], skill: [], store: [], ext: [] };
  DATA.nodes.forEach(n => cols[KIND_MAP[n.kind]].push(n));

  graph.innerHTML = '';
  Object.entries(cols).forEach(([kind, nodes]) => {
    const col = document.createElement('div');
    col.className = 'col';
    const header = document.createElement('div');
    header.className = `col-header ${kind}`;
    header.textContent = KIND_COL_LABEL[kind];
    col.appendChild(header);

    // 依 subgroup 順序排列
    const order = SUBGROUP_ORDER[kind] || [];
    order.forEach(sg => {
      const inGroup = nodes.filter(n => n.subgroup === sg);
      if (!inGroup.length) return;
      const sh = document.createElement('div');
      sh.className = 'subgroup-header';
      sh.textContent = DATA.subgroup_labels[sg] || sg;
      col.appendChild(sh);
      inGroup.forEach(n => {
        const div = document.createElement('div');
        div.className = `node ${kind}`;
        div.dataset.nodeId = n.id;
        div.innerHTML = `<span class="step-no" data-step=""></span>${n.label}`;
        col.appendChild(div);
      });
    });

    graph.appendChild(col);
  });
}

function renderHighlight() {

  currentFlow.steps.forEach((s, i) => {

    });

      el.style.animationDelay = `${delay}ms`;

      stepNoEl.textContent = stepMap[id].join(',');

function buildOrthoPath(fr, tr, wrapRect) {
  const x1 = fr.right - wrapRect.left;
  const y1 = fr.top + fr.height / 2 - wrapRect.top;
  const x2 = tr.left - wrapRect.left;
  const y2 = tr.top + tr.height / 2 - wrapRect.top;
  const r = 8;

  if (x2 > x1) {
    const midX = (x1 + x2) / 2;
    if (Math.abs(y1 - y2) < 2) {
      return `M ${x1} ${y1} L ${x2} ${y2}`;
    }
    const goingDown = y2 > y1;
    const vSign = goingDown ? 1 : -1;
    return `M ${x1} ${y1}
            L ${midX - r} ${y1}
            Q ${midX} ${y1} ${midX} ${y1 + r * vSign}
            L ${midX} ${y2 - r * vSign}
            Q ${midX} ${y2} ${midX + r} ${y2}
            L ${x2} ${y2}`;
  }
  const outX1 = (fr.right - wrapRect.left) + 18;
  const outX2 = (tr.left - wrapRect.left) - 18;
  if (x2 < x1) {
    const dropY = Math.max(fr.bottom, tr.bottom) - wrapRect.top + 18;
    return `M ${x1} ${y1}
            L ${outX1 - r} ${y1}
            Q ${outX1} ${y1} ${outX1} ${y1 + r}
            L ${outX1} ${dropY - r}
            Q ${outX1} ${dropY} ${outX1 - r} ${dropY}
            L ${outX2 + r} ${dropY}
            Q ${outX2} ${dropY} ${outX2} ${dropY - r}
            L ${outX2} ${y2 + r}
            Q ${outX2} ${y2} ${outX2 + r} ${y2}
            L ${x2} ${y2}`;
  }
  // x1 == x2 (same column) — 簡單 S 曲線繞外側
  const outX = (fr.right - wrapRect.left) + 16;
  return `M ${x1} ${y1}
          L ${outX - r} ${y1}
          Q ${outX} ${y1} ${outX} ${y1 + (y2 > y1 ? r : -r)}
          L ${outX} ${y2 + (y2 > y1 ? -r : r)}
          Q ${outX} ${y2} ${outX - r} ${y2}
          L ${x2} ${y2}`;
}

function pathMidpoint(path) {
  const len = path.getTotalLength();
  return path.getPointAtLength(len / 2);
}

function renderEdges(token) {
  const svg = document.getElementById('edges');
  const wrap = document.querySelector('.graph-wrap');
  const rect = wrap.getBoundingClientRect();
  svg.setAttribute('viewBox', `0 0 ${rect.width} ${rect.height}`);
  svg.setAttribute('width', rect.width);
  svg.setAttribute('height', rect.height);
  svg.innerHTML = '';

  const defs = document.createElementNS('http://www.w3.org/2000/svg', 'defs');
  const ghostColor = getCss('--line-ghost') || 'rgba(155,154,151,0.28)';
  defs.innerHTML = `
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="${getCss('--line-active')}"/>
    </marker>
    <marker id="arrow-ghost" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="5" markerHeight="5" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="${ghostColor}"/>
    </marker>
  `;
  svg.appendChild(defs);

  if (isOverview()) {
    // 全景模式 — 畫所有 flows 的所有 edges，使用 ghost line（去重）
    const seen = new Set();
    DATA.flows.forEach(f => {
      f.steps.forEach(s => {
        const key = `${s.from}->${s.to}`;
        if (seen.has(key)) return;
        seen.add(key);
        const fromEl = document.querySelector(`[data-node-id="${s.from}"]`);
        const toEl   = document.querySelector(`[data-node-id="${s.to}"]`);
        if (!fromEl || !toEl) return;
        const fr = fromEl.getBoundingClientRect();
        const tr = toEl.getBoundingClientRect();
        const d = buildOrthoPath(fr, tr, rect);
        const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
        p.setAttribute('d', d);
        p.setAttribute('class', 'edge-ghost');
        p.setAttribute('marker-end', 'url(#arrow-ghost)');
        svg.appendChild(p);
      });
    });
    return;
  }

  // Flow 模式 — 畫該 flow 的 active edges + step badge
  currentFlow.steps.forEach((s, i) => {
    if (token !== renderToken) return;
    const fromEl = document.querySelector(`[data-node-id="${s.from}"]`);
    const toEl   = document.querySelector(`[data-node-id="${s.to}"]`);
    if (!fromEl || !toEl) return;
    const fr = fromEl.getBoundingClientRect();
    const tr = toEl.getBoundingClientRect();
    const d = buildOrthoPath(fr, tr, rect);

    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d);
    p.setAttribute('class', 'edge-line');
    p.setAttribute('marker-end', 'url(#arrow)');
    svg.appendChild(p);

    const len = p.getTotalLength();
    p.style.strokeDasharray = `${len}`;
    p.style.strokeDashoffset = `${len}`;
    p.style.animation = `drawLine 0.65s cubic-bezier(0.4, 0, 0.2, 1) ${i * STAGGER_MS}ms forwards`;

    const mid = pathMidpoint(p);
    const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
    g.style.opacity = '0';
    g.style.animation = `fadeSlide 0.4s ease ${i * STAGGER_MS + 400}ms forwards`;

    const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
    circle.setAttribute('cx', mid.x);
    circle.setAttribute('cy', mid.y);
    circle.setAttribute('r', 10);
    circle.setAttribute('class', 'step-badge');
    g.appendChild(circle);

    const text = document.createElementNS('http://www.w3.org/2000/svg', 'text');
    text.setAttribute('x', mid.x);
    text.setAttribute('y', mid.y);
    text.setAttribute('class', 'step-badge-text');
    text.textContent = String(i + 1);
    g.appendChild(text);

    svg.appendChild(g);
  });
}

    renderEdges(renderToken);
  }, 100);
});

const THEME_KEY = 'ai-ordering-flows-theme';
function applyTheme(t) {
  if (t === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  else document.documentElement.removeAttribute('data-theme');
  document.getElementById('theme-toggle').textContent = t === 'dark' ? 'Light' : 'Dark';
}
function initialTheme() {
  const stored = localStorage.getItem(THEME_KEY);
  if (stored === 'dark' || stored === 'light') return stored;
  return window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
}
let theme = initialTheme();
applyTheme(theme);
document.getElementById('theme-toggle').onclick = () => {
  theme = theme === 'dark' ? 'light' : 'dark';
  localStorage.setItem(THEME_KEY, theme);
  applyTheme(theme);
  renderToken += 1;
  requestAnimationFrame(() => renderEdges(renderToken));
};

renderAll();
</script>
</body>
</html>
