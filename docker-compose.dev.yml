# docker-compose.dev.yml — 開發模式 override
# 用法：docker compose -f docker-compose.yml -f docker-compose.dev.yml up

services:
  backend:
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./orders.db:/app/orders.db
    environment:
      - ENVIRONMENT=dev
      - LOG_FORMAT=color
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    volumes:
      - ./src/frontend_next:/app
      - /app/node_modules
      - /app/.next
    environment:
      - API_REWRITE_TARGET=http://backend:8000
    command: npm run dev
