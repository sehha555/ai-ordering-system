version: "3.8"

services:
  # Python FastAPI 後端 (開發模式)
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    ports:
      - "8000:8000"
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
      - ./orders.db:/app/orders.db
    environment:
      - API_KEY=yuan-secret-key
    command: uvicorn src.api.app:app --host 0.0.0.0 --port 8000 --reload

  # Next.js 前端 (開發模式)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    ports:
      - "3000:3000"
    volumes:
      - ./src/frontend_next:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NEXT_PUBLIC_API_URL=http://backend:8000
    depends_on:
      - backend
    command: npm run dev
